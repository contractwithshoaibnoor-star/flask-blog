{% extends "base.html" %}

{% block title %}Naya Post{% endblock %}

{% block content %}
    <h1>Naya Post Likhein</h1>

    {% with messages = get_flashed_messages() %}
        {% if messages %}
            {% for msg in messages %}
                <p class="flash">{{ msg }}</p>
            {% endfor %}
        {% endif %}
    {% endwith %}

    <form method="POST">
        <label for="title">Title:</label><br>
        <input type="text" id="title" name="title"><br><br>

        <label for="body">Body:</label><br>
        <textarea id="body" name="body" rows="8" cols="50"></textarea><br><br>

        <button type="submit">Post Publish Karein</button>
    </form>
{% endblock %}
