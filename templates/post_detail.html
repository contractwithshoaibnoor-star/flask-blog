{% extends "base.html" %}

{% block title %}{{ post.title }}{% endblock %}

{% block content %}
    <h1>{{ post.title }}</h1>
    <small>{{ post.created_at.strftime('%d %b %Y') }}</small>
    <p>{{ post.body }}</p>

    <a href="{{ url_for('edit_post', post_id=post.id) }}">Edit Karein</a>
    &nbsp;|&nbsp;
    <form method="POST" action="{{ url_for('delete_post', post_id=post.id) }}" style="display:inline" onsubmit="return confirm('Pakka is post ko delete karna hai?');">
        <button type="submit">Delete Karein</button>
    </form>

    <br><br>
    <a href="{{ url_for('home') }}">&larr; Wapas Home</a>
{% endblock %}
